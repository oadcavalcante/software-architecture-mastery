name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validação de conteúdo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-parity compara o PR contra a base para detectar canônico
          # alterado sem incremento de content_version. Precisa do histórico.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes dos validadores
        run: npm test

      # `validate` inclui a checagem de que ROADMAP, READMEs, fix_plan e specs/
      # estão em dia — mora lá, e não num passo só de CI, para que a defasagem
      # apareça antes do push e não depois.
      - name: Validadores de conteúdo
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build (pt-BR + en-US)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
